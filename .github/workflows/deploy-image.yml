# Builds Storify on a GitHub-hosted runner and pushes a ready-to-run image to
# GHCR, so the production server never runs `pnpm build` again. Full setup:
# docs/DEPLOYMENT_PREBUILT_IMAGE.md
name: Deploy image

on:
  push:
    branches:
      - main # every branch your panel deploys from belongs here
  workflow_dispatch:

concurrency:
  group: deploy-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm # version comes from package.json's packageManager
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Require NEXT_PUBLIC_APP_URL
        if: ${{ vars.NEXT_PUBLIC_APP_URL == '' }}
        run: |
          echo "::error::Set NEXT_PUBLIC_APP_URL under Settings -> Secrets and variables -> Actions -> Variables. NEXT_PUBLIC_* values are inlined into the build, so it must equal the store's public URL."
          exit 1

      - name: Install
        run: pnpm install --frozen-lockfile

      # `next build` deliberately skips tsc (see next.config.ts), so CI is
      # the type gate. Delete this step if you'd rather deploy past it.
      - name: Type check
        run: NODE_OPTIONS=--max-old-space-size=8192 pnpm typecheck

      # The build reads nothing from the database (docs/UPGRADE.md -> "Build
      # requirements"), so the runner needs no access to it.
      - name: Build
        env:
          # Everything NEXT_PUBLIC_* is inlined at build time; set the repo
          # Variables to the same values your store runs with today.
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'Storify' }}
          NEXT_PUBLIC_SUPPORT_EMAIL: ${{ vars.NEXT_PUBLIC_SUPPORT_EMAIL || '' }}
          NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_WEB_PUSH_PUBLIC_KEY || '' }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY || '' }}
          NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY || '' }}
          NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID || '' }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID || '' }}
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID || '' }}
          NEXT_PUBLIC_FACEBOOK_PIXEL_ID: ${{ vars.NEXT_PUBLIC_FACEBOOK_PIXEL_ID || '' }}
          NEXT_PUBLIC_TIKTOK_PIXEL_ID: ${{ vars.NEXT_PUBLIC_TIKTOK_PIXEL_ID || '' }}
          NEXT_PUBLIC_LOYALTY_ENABLED: ${{ vars.NEXT_PUBLIC_LOYALTY_ENABLED || '' }}
        run: pnpm build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Assemble & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Lives under deploy/ so no panel auto-detects it as a source build
          file: deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: tells Dokploy to pull the fresh tag and restart. Without
      # the three secrets this step exits successfully and you press Deploy
      # by hand. GitHub Actions does not allow `secrets.*` in a step-level
      # `if`, so the check intentionally happens in the shell.
      - name: Trigger Dokploy redeploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ] || [ -z "$DOKPLOY_APPLICATION_ID" ]; then
            echo "Dokploy secrets are not configured; skipping redeploy."
            exit 0
          fi
          curl --fail-with-body -sS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\": \"$DOKPLOY_APPLICATION_ID\"}"
