overrides:
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.7
  postcss: ^8.5.10
  kysely: 0.28.17
  sharp: ^0.35.3
  # 1.16.12 ships its native file compressed and unpacks it into the user's
  # cache folder on first use, refusing to load where another account can
  # write there: next-intl's plugin loads it with next.config.ts, so some
  # Windows PCs could not build at all. 1.16.2 ships the file itself.
  '@swc/core': 1.16.2

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - core-js-pure
  - esbuild
  - sharp
  - unrs-resolver
